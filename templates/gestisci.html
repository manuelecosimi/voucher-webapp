<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Modifica voucher</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
      .voucher-box {
          background-color: #1e1e1e;
          padding: 30px;
          border-radius: 10px;
          width: 90%;
          max-width: 500px;
          margin: auto;
          text-align: center;
          box-shadow: 0 0 10px #000;
      }

      .form-group {
          margin-bottom: 20px;
          text-align: left;
      }

      label {
          color: #d4af37;
          font-weight: bold;
      }

      input[type="text"],
      textarea {
          width: 100%;
          padding: 10px;
          border-radius: 5px;
          border: none;
          margin-top: 5px;
      }

      textarea {
          background-color: #2e2e2e;
          color: white;
      }

      button {
          background-color: #d4af37;
          color: black;
          border: none;
          padding: 10px 20px;
          font-weight: bold;
          border-radius: 5px;
          cursor: pointer;
      }

      .back-btn {
          background-color: #2e2e2e;
          color: white;
          margin-left: 10px;
      }

      .form-buttons {
          margin-top: 30px;
          text-align: center;
      }

      .voucher-title {
          color: #d4af37;
          text-align: center;
          margin-bottom: 30px;
          font-size: 28px;
      }

      /* Assicura stessa altezza/radius della barra home (oro + input) */
      .input-home-line { align-items: stretch; }
    </style>
</head>
<body class="gestione-voucher-page">

  <div class="voucher-box gestione-voucher-page">
    <h1 class="voucher-title">Gestisci voucher: {{ numero }}</h1>

    <form method="POST">

      {% if voucher.servizio %}
        <!-- CASO: SERVIZIO PIENO -> checkbox (stessa altezza/spaziatura del blocco appuntamento) -->
        <div class="service-line">
          <div class="input-home-label">Servizio effettuato</div>
          <label class="service-field">
            <input type="checkbox" id="servizio_effettuato" name="servizio_effettuato" class="service-checkbox">
          </label>
        </div>
      {% else %}
        <!-- CASO: SERVIZIO VUOTO -> Appuntamento X + € fisso + placeholder "Es. 85" -->
        <div class="input-home-line">
          <div class="input-home-label">Appuntamento {{ voucher.prossimo_appuntamento }}</div>
          <div class="euro-field">
            <input type="text"
                   name="scalatura"
                   class="euro-input euro-with-symbol"
                   placeholder="Es. 85"
                   inputmode="decimal"
                   autocomplete="off">
            <span class="euro-symbol">€</span>
          </div>
        </div>
      {% endif %}

      <div class="form-group">
        <label for="note">Note:</label>
        <textarea id="note" name="note">{{ voucher.note or '' }}</textarea>
      </div>

      <div class="form-buttons">
        <button type="submit">SALVA</button>
        <button type="button" class="back-btn" onclick="history.back()">INDIETRO</button>
      </div>

    </form>
  </div>

</body>
</html>
