<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="format-detection" content="telephone=no, email=no, address=no, date=no, url=no">
  <title>Controlla Voucher</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <img src="static/logo.png" alt="John Barber Logo" class="logo">
    
    <div class="container">
        <h1>Controlla Voucher / Gift Card</h1>

        <!-- MOD: aggiunte classi search-form + search-row per il layout mobile -->
        <form method="post" action="/" class="search-form">
          <div class="search-row">
            <input
              type="text"
              name="numero"
              placeholder="Inserisci numero Voucher o Gift"
              class="input-home"
              autocomplete="off"
              inputmode="numeric"
              pattern="[0-9]*"
              required
            >
            <button type="submit" class="btn-primary">Cerca</button>
          </div>
        </form>

<div class="home-actions">
  <a href="{{ url_for('assegna_gift_card') }}" class="home-secondary-link">
    <button type="button" class="btn-secondary">ASSEGNA GIFT CARD</button>
  </a>
</div>

        {% if errore %}
          <p style="color: red; margin-top: 10px;">{{ errore }}</p>
        {% endif %}
    </div>

    <!-- Footer spostato sotto, fuori dal box grigio -->
    <footer>
        <p>JOHN BARBER SRLS<br>
        Via Domodossola 17 – 20145 Milano<br>
        P.I. 12691510965</p>
        <p>Copyright © 2023 John Barber Milano – Tutti i diritti riservati</p>
    </footer>
</body>
</html>
